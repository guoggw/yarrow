<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0806;color:#d4b483;font-family:"STKaiti","KaiTi","楷体","SimSun",serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 20%,#1a1410 0%,#0a0806 50%,#000 100%);z-index:-2}
.wrap{max-width:720px;margin:0 auto;padding:40px 20px 60px;position:relative;z-index:1}

/* ===== 粒子 ===== */
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:2px;height:2px;background:rgba(232,201,135,.4);border-radius:50%;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:.6}100%{transform:translateY(-10vh) scale(1.5);opacity:0}}

/* ===== 入场动画 ===== */
.enter{opacity:0;transform:translateY(24px);animation:enterUp .8s ease-out forwards}
@keyframes enterUp{to{opacity:1;transform:none}}
.enter-d1{animation-delay:.2s}.enter-d2{animation-delay:.5s}.enter-d3{animation-delay:.8s}.enter-d4{animation-delay:1.1s}

/* ===== 标题区 ===== */
.title-area{text-align:center;margin-bottom:48px}
.taiji-wrap{position:relative;display:inline-block;width:90px;height:90px;margin-bottom:16px}
.taiji-ring{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(200,154,90,.3);animation:ringPulse 3s ease-in-out infinite}
.taiji-ring:nth-child(2){inset:-16px;animation-delay:1s;border-color:rgba(200,154,90,.15)}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.08);opacity:1}}
.taiji-svg{width:90px;height:90px;animation:taijiSpin 20s linear infinite}
@keyframes taijiSpin{to{transform:rotate(360deg)}}
h1{font-size:36px;letter-spacing:12px;color:#e8c987;text-shadow:0 0 30px rgba(232,201,135,.4),0 0 60px rgba(200,120,60,.15);margin-bottom:12px}
.subtitle{font-size:15px;color:#9a8060;letter-spacing:3px;min-height:24px}
.subtitle .cursor{display:inline-block;width:1px;height:14px;background:#c89a5a;margin-left:2px;animation:blink 1s step-end infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}

/* ===== 仪式区 ===== */
.ceremony{text-align:center;margin-bottom:40px}
.guide-text{font-size:15px;color:#8a7050;letter-spacing:2px;margin-bottom:28px;line-height:2}
.guide-text em{color:#c89a5a;font-style:normal}
.question-input{display:block;margin:0 auto;width:100%;max-width:400px;padding:14px 18px;background:rgba(20,14,8,.7);border:1px solid rgba(107,74,43,.5);color:#e8c987;font-family:inherit;font-size:15px;border-radius:8px;outline:none;letter-spacing:2px;text-align:center;transition:border-color .3s,box-shadow .3s}
.question-input:focus{border-color:#c89a5a;box-shadow:0 0 20px rgba(200,154,90,.15)}
.question-input::placeholder{color:#6a5540}
/* 生辰八字面板 */
.bazi-toggle{display:block;text-align:center;margin:18px auto 0;font-size:13px;color:#6a5540;letter-spacing:2px;cursor:pointer;transition:color .3s;user-select:none}
.bazi-toggle:hover{color:#8a7050}
.bazi-toggle .arrow{display:inline-block;transition:transform .3s;margin-right:4px}
.bazi-toggle.open .arrow{transform:rotate(90deg)}
.bazi-panel{max-height:0;overflow:hidden;transition:max-height .4s ease,opacity .3s;opacity:0;margin-top:0}
.bazi-panel.open{max-height:280px;opacity:1;margin-top:14px}
.bazi-inner{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:14px 10px;background:rgba(20,14,8,.5);border:1px solid rgba(107,74,43,.25);border-radius:10px}
.bazi-label{font-size:12px;color:#6a5540;letter-spacing:1px}
.bazi-sel{padding:7px 8px;background:rgba(20,14,8,.8);border:1px solid rgba(107,74,43,.4);color:#c89a5a;font-family:inherit;font-size:13px;border-radius:6px;outline:none;cursor:pointer;min-width:56px;text-align:center;appearance:none;-webkit-appearance:none}
.bazi-sel:focus{border-color:#c89a5a}
.bazi-row{display:flex;gap:6px;align-items:center;width:100%;justify-content:center}
.bazi-privacy{font-size:11px;color:#4a3828;letter-spacing:1px;margin-top:8px;text-align:center}
.bazi-clear{font-size:12px;color:#6a5540;background:none;border:1px solid rgba(107,74,43,.3);padding:4px 12px;border-radius:14px;cursor:pointer;transition:all .25s;letter-spacing:1px}
.bazi-clear:hover{color:#c89a5a;border-color:rgba(200,154,90,.4)}

/* 圆形起卦按钮 */
.btn-divine{position:relative;width:100px;height:100px;border-radius:50%;border:2px solid #c89a5a;background:radial-gradient(circle at 40% 35%,#5c3818,#2a1810);color:#f4e0b0;font-family:inherit;font-size:20px;letter-spacing:6px;cursor:pointer;margin:28px auto 0;display:block;transition:all .3s;box-shadow:0 4px 24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,160,.2)}
.btn-divine:hover{transform:scale(1.05);box-shadow:0 6px 32px rgba(200,154,90,.3),inset 0 1px 0 rgba(255,220,160,.3)}
.btn-divine:active{transform:scale(.97)}
.btn-divine:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-divine .ripple{position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(200,154,90,.5);animation:rippleOut 1.5s ease-out infinite}
@keyframes rippleOut{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.6);opacity:0}}
/* 起卦施法中：旋转法环+呼吸光晕+流光文字 */
.btn-divine:disabled.divining{opacity:1;cursor:default;transform:none;animation:btnBreathe 2s ease-in-out infinite}
@keyframes btnBreathe{0%,100%{box-shadow:0 4px 24px rgba(0,0,0,.6),0 0 16px rgba(255,208,112,.2)}50%{box-shadow:0 4px 24px rgba(0,0,0,.6),0 0 42px rgba(255,208,112,.6)}}
.btn-divine:disabled.divining::before{content:'';position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,rgba(255,208,112,.95) 70deg,transparent 140deg,transparent 180deg,rgba(255,208,112,.55) 250deg,transparent 320deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#fff calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#fff calc(100% - 2.5px));animation:icoSpin 2.2s linear infinite;pointer-events:none}
.btn-divine:disabled.divining::after{content:'';position:absolute;inset:-16px;border-radius:50%;border:1px solid rgba(255,208,112,.3);animation:divineHalo 1.8s ease-in-out infinite;pointer-events:none}
@keyframes divineHalo{0%,100%{transform:scale(.9);opacity:.15}50%{transform:scale(1.05);opacity:.6}}
.btn-divine .btn-txt{font-size:15px;letter-spacing:2px;white-space:nowrap;background:linear-gradient(100deg,#c89a5a 20%,#ffe9b8 40%,#fffbe8 50%,#ffe9b8 60%,#c89a5a 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:txtShimmer 2.4s linear infinite}
@keyframes txtShimmer{to{background-position:-250% 0}}

/* ===== 起卦过程 ===== */
.progress-wrap{text-align:center;margin-bottom:20px}
.progress-text{font-size:13px;color:#8a7050;letter-spacing:2px;margin-bottom:8px}
.progress-bar{width:200px;height:3px;background:rgba(107,74,43,.3);border-radius:2px;margin:0 auto;overflow:hidden}
.progress-bar .fill{height:100%;width:0;background:linear-gradient(90deg,#8a5a2b,#e8c987);border-radius:2px;transition:width .4s ease}
/* 蓍草可视化（绝对定位演算舞台） */
.yarrow-viz{position:relative;height:196px;margin:20px 0;padding:10px;background:rgba(10,7,4,.5);border-radius:8px;border:1px solid rgba(58,42,26,.4);overflow:hidden}
.yarrow-stick{position:absolute;left:0;bottom:12px;width:3px;height:52px;background:linear-gradient(180deg,#e8c987,#8a5a2b);border-radius:1px;transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .5s ease,box-shadow .3s;transform-origin:bottom center;will-change:transform}
.yarrow-stick.hung{background:linear-gradient(180deg,#ffe9b8,#e8c987);box-shadow:0 0 10px rgba(255,208,112,.75)}
.yarrow-stick.count-glow{background:linear-gradient(180deg,#ffe9b8,#ffc860);box-shadow:0 0 9px rgba(255,208,112,.85)}
.yarrow-stick.remainder{background:linear-gradient(180deg,#ffd070,#ff9a3d);box-shadow:0 0 13px rgba(255,160,60,.95)}
.yarrow-stick.bright{background:linear-gradient(180deg,#fff3d6,#ffd070);box-shadow:0 0 12px rgba(255,208,112,.9)}
.yarrow-stick.gone{opacity:0}
.yarrow-stick.removed{opacity:0;pointer-events:none}
/* 逐爻构建 */
.hex-build{display:flex;flex-direction:column-reverse;align-items:center;gap:6px;margin:20px 0}
.hex-build .build-yao{display:flex;gap:8px;align-items:center;opacity:0;transform:scaleX(0);animation:yaoAppear .5s ease-out forwards}
@keyframes yaoAppear{to{opacity:1;transform:scaleX(1)}}
.build-yao .bar{height:8px;border-radius:2px;background:#e8c987;box-shadow:0 0 8px rgba(232,201,135,.4)}
.build-yao.yang .bar{width:120px}
.build-yao.yin .bar{width:56px}
.build-yao.changing .bar{animation:yaoGlow 1s ease-in-out infinite alternate}
@keyframes yaoGlow{from{box-shadow:0 0 4px rgba(232,201,135,.3)}to{box-shadow:0 0 16px rgba(232,201,135,.8)}}
/* 旁白（单行，取代多行日志，根治浮字重叠） */
.narration{font-size:14px;color:#c89a5a;letter-spacing:1px;min-height:24px;text-align:center;line-height:1.7;opacity:0}
.narration.show{animation:narrIn .5s ease-out forwards}
@keyframes narrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.narration .biao{color:#e8c987}
.narration b{color:#ffd070;font-weight:normal;text-shadow:0 0 8px rgba(255,208,112,.45)}
/* 爻符（定宽，阴阳等长） */
.log-yao{display:inline-flex;gap:3px;align-items:center;width:40px;height:6px;vertical-align:middle;margin:0 3px}
.log-yao::before{content:'';flex:1;height:4px;border-radius:1px;background:linear-gradient(90deg,#c89a5a,#e8c987,#c89a5a)}
.log-yao.yin::after{content:'';flex:1;height:4px;border-radius:1px;background:linear-gradient(90deg,#c89a5a,#e8c987,#c89a5a)}

/* ===== 演算页（全屏覆盖层，独立成页只展示演算）===== */
#pageProcess{position:fixed;inset:0;z-index:400;background:radial-gradient(ellipse at 50% 16%,#181008 0%,#0a0705 55%,#040302 100%);opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s;display:flex;align-items:center;justify-content:center;overflow:hidden}
#pageProcess.active{opacity:1;visibility:visible}
.process-inner{width:100%;max-width:560px;padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:16px}
/* 阶段字幕（《系辞》四步） */
.stage-caption{text-align:center;min-height:92px;display:flex;flex-direction:column;justify-content:center}
.stage-xici{font-size:30px;letter-spacing:9px;text-indent:9px;color:#f4e0b0;text-shadow:0 0 26px rgba(232,201,135,.5),0 0 60px rgba(200,120,60,.2);opacity:0}
.stage-xici.swap{animation:stageIn .7s ease-out forwards}
.stage-sub{font-size:13px;color:#8a7050;letter-spacing:4px;text-indent:4px;margin-top:9px;opacity:0}
.stage-sub.swap{animation:stageIn .7s ease-out .12s forwards}
@keyframes stageIn{from{opacity:0;transform:translateY(14px) scale(.96);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
#pageProcess .progress-wrap{margin-bottom:0}
#pageProcess .yarrow-viz{width:100%;margin:0}
#pageProcess .hex-build{margin:0;min-height:118px;width:100%}
/* 止卦按钮 */
.btn-stop{margin-top:4px;padding:10px 30px 10px 36px;border-radius:40px;border:1px solid rgba(107,74,43,.5);background:rgba(20,14,8,.6);color:#8a7050;font-family:inherit;font-size:14px;letter-spacing:6px;cursor:pointer;transition:all .3s}
.btn-stop:hover{border-color:#c89a5a;color:#c89a5a;box-shadow:0 0 14px rgba(200,154,90,.2)}
.btn-stop:active{transform:scale(.96)}
/* 倍速控制 */
.speed-control{display:flex;gap:6px;margin-top:12px;padding:6px 10px;background:rgba(20,14,8,.5);border-radius:20px;border:1px solid rgba(107,74,43,.3)}
.speed-btn{padding:6px 12px;border:none;background:transparent;color:#8a7050;font-size:12px;letter-spacing:1px;cursor:pointer;border-radius:14px;transition:all .25s}
.speed-btn:hover{color:#c89a5a;background:rgba(200,154,90,.1)}
.speed-btn.active{color:#e8c987;background:rgba(200,154,90,.2);box-shadow:0 0 8px rgba(200,154,90,.15)}
/* 矮视口适配（保证一屏完整展示） */
@media (max-height:700px){
  .process-inner{gap:11px}
  .stage-caption{min-height:74px}
  .stage-xici{font-size:26px}
  #pageProcess .yarrow-viz{height:160px}
  #pageProcess .hex-build{min-height:102px}
}
@media (max-height:580px){
  .process-inner{gap:8px}
  .stage-caption{min-height:60px}
  .stage-xici{font-size:22px;letter-spacing:6px;text-indent:6px}
  #pageProcess .yarrow-viz{height:132px}
  #pageProcess .hex-build{min-height:90px}
}

/* ===== 揭晓特效 ===== */
.reveal-overlay{position:fixed;inset:0;z-index:999;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.reveal-overlay.active{opacity:1;pointer-events:all}
.reveal-text{font-size:64px;letter-spacing:20px;color:#e8c987;text-shadow:0 0 40px rgba(232,201,135,.6);animation:revealPulse 1.2s ease-out}
@keyframes revealPulse{0%{transform:scale(.5);opacity:0}40%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}

/* ===== 结果区（卦象盒）===== */
.hex-display{display:flex;justify-content:center;gap:48px;margin:32px 0;flex-wrap:wrap}
.hex-box{text-align:center;min-width:180px;animation:hexReveal .8s ease-out both;border:1px solid rgba(200,154,90,.22);border-radius:14px;padding:22px 18px;background:rgba(20,14,8,.45);box-shadow:0 0 28px rgba(200,154,90,.1),inset 0 0 20px rgba(200,154,90,.04)}
@keyframes hexReveal{from{transform:scale(.6);opacity:0;filter:blur(4px)}to{transform:scale(1);opacity:1;filter:none}}
.hex-name{font-size:22px;color:#e8c987;margin-bottom:6px;letter-spacing:4px;text-shadow:0 0 12px rgba(232,201,135,.4)}
.hex-name .ch{display:inline-block;opacity:0;animation:charReveal .4s ease-out forwards}
@keyframes charReveal{from{opacity:0;transform:translateY(8px) scale(1.3);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
.hex-sub{font-size:12px;color:#8a7050;margin-bottom:14px;letter-spacing:2px}
.hex-visual{display:inline-flex;flex-direction:column-reverse;gap:6px;padding:16px 24px;background:rgba(10,7,4,.5);border:1px solid rgba(107,74,43,.3);border-radius:8px}
.yao{display:flex;justify-content:center;gap:10px;height:12px;align-items:center}
.yao .bar{height:8px;border-radius:2px;background:linear-gradient(90deg,#c89a5a,#e8c987,#c89a5a)}
.yao.yang .bar{width:140px}
.yao.yin .bar{width:65px}
.yao.changing{position:relative}
.yao.changing::before{content:'';position:absolute;right:-24px;top:50%;transform:translateY(-50%);width:17px;height:17px;border-radius:50%;background:radial-gradient(circle,rgba(255,208,112,.65) 0%,rgba(255,208,112,.22) 45%,transparent 72%);animation:glowPulse 1.1s ease-in-out infinite alternate;pointer-events:none}
.yao.changing::after{content:'';position:absolute;right:-21px;top:50%;transform:translateY(-50%);width:11px;height:11px;background:linear-gradient(135deg,#ffe9b8,#ffc860);clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes glowPulse{from{opacity:.3;transform:translateY(-50%) scale(.75)}to{opacity:1;transform:translateY(-50%) scale(1.3)}}

/* ===== 解析区 ===== */
.interpret{font-size:15px;line-height:1.9}
.interpret .section-title{font-size:16px;color:#e8c987;letter-spacing:3px;margin:28px 0 12px;padding:10px 0 10px 14px;border-left:3px solid #c89a5a;background:linear-gradient(90deg,rgba(200,154,90,.08),transparent);opacity:0;animation:fadeSlide .5s ease-out forwards}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.interpret b{color:#f4e0b0;font-weight:normal}
/* 天机总览（结论前置） */
.tianji{text-align:center;padding:32px 20px 28px;margin:8px 0 8px;background:radial-gradient(ellipse at 50% 0%,rgba(200,154,90,.12),transparent 70%);border:1px solid rgba(200,154,90,.25);border-radius:12px;animation:hexReveal .8s ease-out both}
.tianji-question{font-size:13px;color:#8a7050;letter-spacing:2px;margin-bottom:16px}
.tianji-question b{color:#c89a5a}
.tianji-verdict{font-size:30px;letter-spacing:8px;font-weight:bold;margin-bottom:14px;text-shadow:0 0 24px currentColor,0 0 48px currentColor}
.tianji-line{font-size:16px;color:#d4b483;letter-spacing:2px;line-height:1.8}
.tianji-line .qmark{color:#c89a5a}
/* 叙事段落（大师口吻） */
.narrative{padding:4px 0 4px 16px;margin:8px 0 18px;border-left:2px solid rgba(200,154,90,.35)}
.narr-lead{font-size:14px;color:#c89a5a;letter-spacing:1px;margin-bottom:6px}
.narr-lead .narr-star{position:relative;display:inline-block;width:9px;height:9px;margin-right:7px;vertical-align:0;animation:starPulse 1.1s ease-in-out infinite alternate}
.narr-lead .narr-star::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#ffe9b8,#ffc860);clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
.narr-main{font-size:15px;color:#d4b483;line-height:1.9}
.narrative.advice{border-left-color:rgba(160,200,120,.5);background:rgba(140,180,120,.05);border-radius:0 8px 8px 0;padding:14px 16px}
.narrative.advice .narr-main{color:#cfe0b8}
.quote{font-size:12px;color:#6a5540;line-height:1.7;margin-top:8px;padding:6px 10px;background:rgba(10,7,4,.4);border-left:2px solid rgba(107,74,43,.4);border-radius:0 4px 4px 0}
.quote::before{content:'原文 · ';color:#8a6a45}
/* 四维详解引导语 */
.aspects-intro{font-size:13px;color:#9a8060;line-height:1.8;margin-bottom:12px;padding:8px 12px;background:rgba(20,14,8,.4);border-radius:6px}
/* 占法脚注 */
.footnote{font-size:12px;color:#5a4832;line-height:1.7;margin-top:28px;padding-top:14px;border-top:1px dashed rgba(107,74,43,.3)}

/* 分类卡片 */
.aspects-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
.aspect-card{background:rgba(30,20,12,.6);border:1px solid rgba(107,74,43,.35);border-radius:10px;padding:16px;transition:all .3s;opacity:0;animation:fadeSlide .5s ease-out forwards}
.aspect-card:hover{border-color:#c89a5a;transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.aspect-icon{font-size:22px;margin-bottom:8px}
.aspect-title{font-size:14px;color:#e8c987;letter-spacing:2px;margin-bottom:8px;border-bottom:1px dashed rgba(107,74,43,.3);padding-bottom:6px}
.aspect-text{font-size:13px;color:#b89968;line-height:1.8}
/* 应期指引 */
.narrative.timing{padding:16px 18px;background:linear-gradient(135deg,rgba(30,20,12,.6),rgba(20,14,8,.4));border:1px solid rgba(200,154,90,.3);border-radius:10px;margin:12px 0 20px}
.timing-lead{font-size:14px;color:#d4b483;line-height:1.8;margin-bottom:12px}
.timing-block{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px dashed rgba(200,154,90,.2);border-bottom:1px dashed rgba(200,154,90,.2)}
.timing-row{display:flex;align-items:baseline;gap:12px;font-size:13px;line-height:1.6}
.timing-label{color:#8a7050;min-width:72px;letter-spacing:2px;flex-shrink:0}
.timing-val{color:#e8c987;flex:1}
.timing-note{font-size:13px;color:#b89968;line-height:1.8;margin-top:12px;padding-top:8px}
/* 命卦合参 */
.narrative.bazi-section{padding:16px 18px;background:linear-gradient(135deg,rgba(30,20,12,.6),rgba(20,14,8,.4));border:1px solid rgba(200,154,90,.3);border-radius:10px;margin:12px 0 20px}
.bazi-pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.pill-label{font-size:11px;color:#6a5540;letter-spacing:1px}
.pill-val{font-size:18px;color:#e8c987;letter-spacing:4px;text-shadow:0 0 10px rgba(232,201,135,.3);margin-right:8px}
.bazi-meta{font-size:13px;color:#b89968;line-height:2}
.bazi-meta b{color:#e8c987;font-weight:normal}
.bazi-meta .fav{color:#c4d97a}
.gua-el-note{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(200,154,90,.2);color:#d4b483}

/* ===== 底部 ===== */
.footer{text-align:center;margin-top:48px;font-size:12px;color:#4a3a28;letter-spacing:3px}

/* ===== 双页面结构：解卦页（全屏覆盖层）===== */
#resultBackdrop{position:fixed;inset:0;z-index:499;background:radial-gradient(ellipse at 50% 0%,#16100a 0%,#0a0705 55%,#050302 100%);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;overflow:hidden}
#resultBackdrop::after{content:'';position:absolute;left:50%;top:50%;width:150vmin;height:150vmin;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(200,154,90,.055) 0deg 15deg,transparent 15deg 45deg);border-radius:50%;animation:watermarkSpin 60s linear infinite;-webkit-mask-image:radial-gradient(circle,rgba(0,0,0,.85) 0%,transparent 68%);mask-image:radial-gradient(circle,rgba(0,0,0,.85) 0%,transparent 68%)}
@keyframes watermarkSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#pageResult{position:fixed;inset:0;z-index:500;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
#pageResult.active,#resultBackdrop.active{opacity:1;visibility:visible}
body.locked{overflow:hidden}
.result-scroll{max-width:720px;margin:0 auto;padding:56px 24px 130px;position:relative;z-index:1}
/* 门楣（解卦页头部）*/
.result-header{text-align:center;margin-bottom:8px;opacity:0;transform:translateY(24px) scale(.95);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
#pageResult.revealed .result-header{opacity:1;transform:none}
.result-overline{font-size:13px;color:#8a7050;letter-spacing:9px;margin-bottom:16px}
.result-guaname{font-size:40px;color:#f4e0b0;letter-spacing:10px;font-weight:bold;text-shadow:0 0 24px rgba(232,201,135,.55),0 0 64px rgba(200,120,60,.3)}
.result-divider{width:200px;height:1px;margin:22px auto 0;background:linear-gradient(90deg,transparent,#c89a5a,transparent);position:relative}
.result-divider .divider-taiji{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:0 12px;background:radial-gradient(50% 50% at 50% 50%,rgba(10,7,5,.95) 0%,rgba(10,7,5,.88) 55%,transparent 100%);display:flex;align-items:center}
.result-divider .divider-taiji-svg{width:16px;height:16px;animation:taijiSpin 10s linear infinite;filter:drop-shadow(0 0 5px rgba(232,201,135,.45))}
.result-footer{text-align:center;margin-top:56px;font-size:12px;color:#4a3a28;letter-spacing:3px}
/* 滚动浮现 */
.sr{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,1,.36,1)}
.sr.show{opacity:1;transform:none}

/* ===== 金色双门：开门见卦 ===== */
#doors{position:fixed;inset:0;z-index:600;pointer-events:none}
.door{position:absolute;top:0;bottom:0;width:50.5%;background:linear-gradient(135deg,#3a2415 0%,#241509 45%,#1a0f06 100%);box-shadow:inset 0 0 80px rgba(0,0,0,.75);transition:transform .9s cubic-bezier(.7,0,.3,1);will-change:transform}
.door::before{content:'';position:absolute;inset:20px;border:1px solid rgba(200,154,90,.3);border-radius:4px;box-shadow:inset 0 0 40px rgba(200,154,90,.07)}
.door::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(200,154,90,.05) 0 1px,transparent 1px 28px)}
.door-left{left:0;transform:translateX(-101%)}
.door-right{right:0;transform:translateX(101%)}
#doors.closed .door-left{transform:translateX(0)}
#doors.closed .door-right{transform:translateX(0)}
.door-seam{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:linear-gradient(180deg,transparent 4%,rgba(255,224,160,.95) 50%,transparent 96%);opacity:0;transition:opacity .4s}
#doors.closed .door-seam{opacity:1;animation:seamPulse 1.2s ease-in-out infinite}
@keyframes seamPulse{0%,100%{box-shadow:0 0 14px 3px rgba(255,208,112,.55)}50%{box-shadow:0 0 32px 8px rgba(255,224,160,.95)}}

/* ===== 悬浮“再占一卦”按钮 ===== */
#btnAgain{position:fixed;right:28px;bottom:34px;z-index:610;display:flex;align-items:center;gap:10px;padding:15px 26px 15px 20px;border-radius:60px;border:none;overflow:hidden;background:linear-gradient(135deg,rgba(58,36,18,.92),rgba(26,15,6,.95));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#f4e0b0;font-family:inherit;font-size:15px;font-weight:500;letter-spacing:4px;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(28px) scale(.9);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1),visibility .6s;box-shadow:0 8px 32px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,224,160,.15)}
#btnAgain::before{content:'';position:absolute;inset:0;border-radius:60px;padding:1px;background:linear-gradient(135deg,rgba(255,208,112,.8),rgba(200,154,90,.25) 40%,rgba(255,208,112,.6));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
#btnAgain::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,224,160,.18),transparent);transform:skewX(-20deg);animation:btnSheen 3.5s ease-in-out infinite;pointer-events:none;border-radius:60px}
@keyframes btnSheen{0%,60%{left:-80%}100%{left:130%}}
#btnAgain .btn-ico{position:relative;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%}
#btnAgain .btn-ico::before{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,208,112,.8) 0deg 24deg,transparent 24deg 45deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#fff calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#fff calc(100% - 3px));animation:icoSpin 14s linear infinite}
#btnAgain .btn-ico .btn-taiji{width:18px;height:18px;filter:drop-shadow(0 0 6px rgba(255,208,112,.6));animation:icoSpinR 9s linear infinite}
@keyframes icoSpinR{to{transform:rotate(-360deg)}}
@keyframes icoSpin{to{transform:rotate(360deg)}}
#btnAgain.show{opacity:1;visibility:visible;transform:none}
#btnAgain:hover{transform:translateY(-3px);box-shadow:0 12px 44px rgba(200,154,90,.35),0 4px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,224,160,.25)}
#btnAgain:active{transform:translateY(0) scale(.97)}

/* 天机判定流光扫过 */
.tianji-verdict{position:relative;overflow:hidden}
.tianji-verdict::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;transform:translateX(-160%);background:linear-gradient(105deg,transparent,rgba(255,240,200,.32),transparent);animation:shimmer 3.2s ease-in-out infinite;pointer-events:none}
@keyframes shimmer{0%{transform:translateX(-160%)}55%,100%{transform:translateX(380%)}}

/* ===== 起卦页：八卦能量阵 ===== */
.yarrow-viz{position:relative}
.yarrow-viz::before{content:'';position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%);border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(200,154,90,.09) 0deg 15deg,transparent 15deg 45deg);animation:watermarkSpin 24s linear infinite;opacity:0;transition:opacity .6s;pointer-events:none;-webkit-mask-image:radial-gradient(circle,rgba(0,0,0,.9) 0%,transparent 72%);mask-image:radial-gradient(circle,rgba(0,0,0,.9) 0%,transparent 72%)}
.process-section.active .yarrow-viz::before{opacity:1}

/* ===== 特效层（火力全开）===== */
#fxCanvas{position:fixed;inset:0;pointer-events:none;z-index:998}
/* 蓍草辉光 */
.yarrow-stick{box-shadow:0 0 6px rgba(232,201,135,.5);will-change:transform,opacity}
.yarrow-stick.bright{filter:brightness(1.8)}
/* 进度条辉光脉冲 */
.progress-bar .fill{box-shadow:0 0 8px rgba(232,201,135,.6)}
.progress-bar .fill.pulse{animation:progPulse .4s ease-out}
@keyframes progPulse{0%{box-shadow:0 0 4px rgba(232,201,135,.4)}50%{box-shadow:0 0 16px rgba(255,208,112,.95)}100%{box-shadow:0 0 8px rgba(232,201,135,.6)}}
.progress-bar .fill.milestone{animation:milePulse .7s ease-out}
@keyframes milePulse{0%{box-shadow:0 0 4px rgba(232,201,135,.4)}40%{box-shadow:0 0 26px 5px rgba(255,208,112,1)}100%{box-shadow:0 0 8px rgba(232,201,135,.6)}}
/* 逐爻绘制：发光笔触 + 能量光晕 */
.hex-build{position:relative;z-index:0}
.build-yao{position:relative;will-change:transform,opacity}
.build-yao .bar{animation:yaoDraw .6s ease-out}
.build-yao.changing .bar{animation:yaoDraw .6s ease-out,yaoGlow 1s ease-in-out .6s infinite alternate}
@keyframes yaoDraw{0%{box-shadow:0 0 24px 6px rgba(255,220,140,.95);filter:brightness(2)}60%{box-shadow:0 0 14px 3px rgba(255,208,112,.7)}100%{box-shadow:0 0 8px rgba(232,201,135,.4);filter:brightness(1)}}
.build-aura{position:absolute;left:50%;top:50%;width:240px;height:240px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(232,201,135,.4) 0%,rgba(200,154,90,.14) 40%,transparent 70%);border-radius:50%;opacity:0;transition:opacity .6s ease;pointer-events:none;z-index:-1;filter:blur(8px)}
/* 动爻角标 */
.build-yao .dong-badge{position:absolute;right:-38px;top:50%;transform:translateY(-50%) scale(0);font-size:11px;color:#ffd070;letter-spacing:1px;white-space:nowrap;animation:badgePop .5s cubic-bezier(.34,1.56,.64,1) .15s forwards;text-shadow:0 0 8px rgba(255,208,112,.6)}
.build-yao .dong-badge .mini-star{position:relative;display:inline-block;width:9px;height:9px;margin-left:4px;vertical-align:-1px;animation:starPulse 1.1s ease-in-out infinite alternate}
.build-yao .dong-badge .mini-star::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#ffe9b8,#ffc860);clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)}
@keyframes starPulse{from{filter:drop-shadow(0 0 2px rgba(255,208,112,.4))}to{filter:drop-shadow(0 0 7px rgba(255,208,112,.95))}}
@keyframes badgePop{0%{transform:translateY(-50%) scale(0)}70%{transform:translateY(-50%) scale(1.25)}100%{transform:translateY(-50%) scale(1)}}
/* 全屏脉动 */
.flash-overlay{position:fixed;inset:0;z-index:997;pointer-events:none;background:radial-gradient(circle,rgba(255,224,160,.9),rgba(255,208,112,.4));opacity:0}
.flash-overlay.pulse{animation:screenFlash .45s ease-out}
@keyframes screenFlash{0%{opacity:0}30%{opacity:.22}100%{opacity:0}}
/* 卦成光芒 */
.reveal-overlay{overflow:hidden}
.reveal-rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(232,201,135,.13) 0deg 6deg,transparent 6deg 30deg);-webkit-mask-image:radial-gradient(circle,rgba(0,0,0,.9) 0%,transparent 62%);mask-image:radial-gradient(circle,rgba(0,0,0,.9) 0%,transparent 62%);animation:raysSpin 16s linear infinite;opacity:0;transition:opacity .4s}
.reveal-overlay.active .reveal-rays{opacity:1}
@keyframes raysSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.reveal-text{position:relative;z-index:2}
.reveal-overlay.active .reveal-text{animation:revealPulse 1.2s ease-out,revealBright 1.8s ease-out}
@keyframes revealBright{0%{filter:brightness(1)}25%{filter:brightness(2.2);text-shadow:0 0 60px rgba(255,224,160,.95),0 0 120px rgba(255,208,112,.6)}100%{filter:brightness(1)}}
/* 背景共鸣 + 粒子加密 */
body::before{transition:filter .4s}
body.resonate::before{filter:brightness(1.6);transition:filter .12s}
.particles .p2{display:none}
.particles.dense .p2{display:block;animation-duration:5s !important}
/* 静音按钮 */
.btn-mute{position:fixed;top:16px;right:16px;z-index:1000;width:40px;height:40px;border-radius:50%;border:1px solid rgba(107,74,43,.5);background:rgba(20,14,8,.7);color:#c89a5a;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;padding:0}
.btn-mute svg{display:block}
.btn-mute .ico-off{display:none}
.btn-mute.muted .ico-on{display:none}
.btn-mute.muted .ico-off{display:block}
.btn-mute:hover{border-color:#c89a5a;box-shadow:0 0 12px rgba(200,154,90,.3)}

/* ===== 移动端 ===== */
@media(max-width:600px){
  .wrap{padding:24px 16px 48px}
  h1{font-size:26px;letter-spacing:8px}
  .taiji-wrap{width:70px;height:70px}
  .taiji-svg{width:70px;height:70px}
  .btn-divine{width:88px;height:88px;font-size:18px}
  .btn-divine .btn-txt{font-size:12.5px;letter-spacing:1px}
  .hex-display{flex-direction:column;align-items:center;gap:24px}
  .aspects-grid{grid-template-columns:1fr}
  .yao.yang .bar{width:110px}
  .yao.yin .bar{width:50px}
  .build-yao.yang .bar{width:90px}
  .build-yao.yin .bar{width:41px}
  .reveal-text{font-size:42px;letter-spacing:12px}
  .result-guaname{font-size:30px;letter-spacing:7px}
  .result-scroll{padding:44px 18px 120px}
  #btnAgain{right:16px;bottom:24px;padding:13px 20px 13px 16px;font-size:13px;letter-spacing:3px;gap:8px}
    #btnAgain .btn-ico{width:28px;height:28px}
      #btnAgain .btn-ico .btn-taiji{width:15px;height:15px}
  #resultBackdrop::after{opacity:.6}
}
@media(pointer:coarse){.btn-divine:hover{transform:none}.aspect-card:hover{transform:none}}
</style>
</head>
<body>
<!-- 粒子背景 -->
<div class="particles" id="particles"></div>
<!-- 特效画布 + 全屏脉动 -->
<canvas id="fxCanvas"></canvas>
<div class="flash-overlay" id="flashOverlay"></div>
<button class="btn-mute" id="btnMute" title="音效开关" aria-label="音效开关">
<svg class="ico-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"/></svg>
<svg class="ico-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><line x1="16" y1="9.5" x2="21.5" y2="15"/><line x1="21.5" y1="9.5" x2="16" y2="15"/></svg>
</button>

<div class="wrap" id="pageDivine">
  <!-- 标题区 -->
  <div class="title-area enter">
    <div class="taiji-wrap">
      <div class="taiji-ring"></div>
      <div class="taiji-ring"></div>
      <svg class="taiji-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#241708"/><path d="M50,2 A48,48 0 0,1 50,98 A24,24 0 0,1 50,50 A24,24 0 0,0 50,2 Z" fill="#e8c987"/><circle cx="50" cy="74" r="8" fill="#241708"/><circle cx="50" cy="26" r="8" fill="#e8c987"/><circle cx="50" cy="50" r="47" fill="none" stroke="rgba(232,201,135,.45)" stroke-width="1.5"/></svg>
    </div>
    <h1>蓍 草 占 卜</h1>
    <div class="subtitle" id="subtitle"></div>
  </div>

  <!-- 仪式区 -->
  <div class="ceremony enter enter-d2">
    <p class="guide-text">心诚则灵 · 静心三息 · <em>默念所问</em></p>
    <input class="question-input" id="question" placeholder="所问之事（可留空）" />
    <!-- 生辰八字（可选） -->
    <div class="bazi-toggle" id="baziToggle"><span class="arrow">▸</span>生辰八字（可选 · 仅存本机）</div>
    <div class="bazi-panel" id="baziPanel">
      <div class="bazi-inner">
        <div class="bazi-row">
          <span class="bazi-label">出生</span>
          <select class="bazi-sel" id="baziYear"></select>
          <span class="bazi-label">年</span>
          <select class="bazi-sel" id="baziMonth"></select>
          <span class="bazi-label">月</span>
          <select class="bazi-sel" id="baziDay"></select>
          <span class="bazi-label">日</span>
        </div>
        <div class="bazi-row">
          <span class="bazi-label">时辰</span>
          <select class="bazi-sel" id="baziHour" style="min-width:100px"></select>
          <span class="bazi-label" style="margin-left:6px">性别</span>
          <select class="bazi-sel" id="baziGender" style="min-width:60px">
            <option value="">--</option>
            <option value="M">男</option>
            <option value="F">女</option>
          </select>
          <button class="bazi-clear" id="baziClear">清空</button>
        </div>
        <div class="bazi-privacy">ℹ 生辰信息仅存于本机浏览器，不会上传</div>
      </div>
    </div>
    <button class="btn-divine" id="btnStart">起卦<span class="ripple"></span></button>
  </div>

  <!-- 揭晓遮罩 -->
  <div class="reveal-overlay" id="revealOverlay"><div class="reveal-rays"></div><div class="reveal-text">卦 成</div></div>

  <div class="footer enter enter-d4">— 天垂象 · 见吉凶 · 圣人则之 —</div>
</div>

<!-- ===== 演算页（全屏覆盖层）===== -->
<div id="pageProcess">
  <div class="process-inner">
    <div class="stage-caption">
      <div class="stage-xici" id="stageXici">大衍之数五十</div>
      <div class="stage-sub" id="stageSub">其用四十有九</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-text" id="progressText">第一变 / 共十八变</div>
      <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
    </div>
    <div class="yarrow-viz" id="yarrowViz"></div>
    <div class="narration" id="narration"></div>
    <div class="hex-build" id="hexBuild"><div class="build-aura" id="buildAura"></div></div>
    <button class="btn-stop" id="btnStop">止 卦</button>
    <div class="speed-control">
      <button class="speed-btn" data-speed="0.5">0.5×</button>

<script>
/* ========== 粒子初始化 ========== */
(function initParticles(){

/* ========== 打字机 ========== */
(function typewriter(){
  const el=document.getElementById('subtitle');

  let i=0;

/* ========== Canvas 粒子特效引擎 ========== */
const fxC=(()=>{
  const cv=document.getElementById('fxCanvas'),ctx=cv.getContext('2d');
  let P=[],running=false;
  const isMobile=()=>window.innerWidth<600;
  function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    P=P.filter(p=>p.life>0);
    for(const p of P){
      p.life-=p.decay;p.x+=p.vx;p.y+=p.vy;
      if(p.type==='spark'){p.vy+=0.12;p.vx*=0.98;ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(p.r*p.life,0),0,6.283);ctx.fill();}
      else if(p.type==='ring'){const pr=1-p.life;ctx.globalAlpha=Math.max(p.life,0)*0.8;ctx.strokeStyle=p.color;ctx.lineWidth=Math.max(2.5*p.life,0.1);ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(p.r0+pr*p.expand,0.1),0,6.283);ctx.stroke();}
      else if(p.type==='text'){ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.font='bold 15px KaiTi,serif';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);}
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    if(P.length>0){requestAnimationFrame(tick);}else{running=false;ctx.clearRect(0,0,cv.width,cv.height);}
  }
  function go(){if(!running){running=true;requestAnimationFrame(tick);}}
  const cap=()=>isMobile()?30:60;
  return{
    burst(x,y,color,count,speed){
      count=Math.min(count||18,cap());speed=speed||3.5;
      for(let i=0;i<count;i++){const a=Math.random()*6.283,v=(0.4+Math.random())*speed;
        P.push({type:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,r:1.5+Math.random()*2,life:1,decay:0.02+Math.random()*0.02,color});}
      go();
    },
    ring(x,y,color,r0,expand){P.push({type:'ring',x,y,color,r0:r0||10,expand:expand||90,life:1,decay:0.025});go();},
    float(x,y,text,color){P.push({type:'text',x,y,vx:0,vy:-0.9,text,color,life:1,decay:0.014});go();}
  };
})();
function fxCenter(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2];}
/* ========== Web Audio 音效引擎（主增益+压缩器，编钟/梵钟音色） ========== */
const sfx=(()=>{
  let ac=null,muted=false,master=null;
  const vol=()=>(window.innerWidth<600?0.8:1.0);
  function ensure(){
    if(!ac){
      try{
        ac=new(window.AudioContext||window.webkitAudioContext)();
        const comp=ac.createDynamicsCompressor();
        comp.threshold.value=-20;comp.knee.value=22;comp.ratio.value=7;comp.attack.value=0.002;comp.release.value=0.28;
        master=ac.createGain();master.gain.value=1.5;
        master.connect(comp);comp.connect(ac.destination);
      }catch(e){}
    }
    if(ac&&ac.state==='suspended')ac.resume();
    return ac;
  }
  function tone(freq,dur,type,gain,delay){
    const a=ensure();if(!a||muted||!master)return;
    const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
  }
  return{
    unlock(){ensure();},
    /* 每爻落定：青铜编钟，五声音阶（宫商角徵羽）随爻位递升 */
    yao(idx){
      const base=[262,294,330,392,440,523][idx]||392;const v=vol();
      tone(base,1.7,'sine',v*0.6);          /* 基频 */
      tone(base*0.5,2.0,'sine',v*0.22);     /* 低八度厚度 */
      tone(base*2,1.2,'sine',v*0.26);       /* 八度泛音 */
      tone(base*2.99,0.9,'sine',v*0.14);    /* 金属感泛音 */
      tone(base*4.1,0.6,'triangle',v*0.07); /* 钟体高频 */
    },
    /* 动爻：清越磬音叠加 */
    change(){const v=vol();tone(1046,0.7,'sine',v*0.42,0.03);tone(1568,0.55,'sine',v*0.3,0.1);tone(2093,0.45,'triangle',v*0.18,0.16);},
    /* 分二拨草：蓍草刷分两堆的沙沙声（带通滤波噪声）+ 茎杆轻碰 */
    swish(){
      const a=ensure();if(!a||muted||!master)return;
      const v=vol(),t=a.currentTime;
      [0,0.08].forEach((dt,k)=>{
        const dur=0.24;
        const buf=a.createBuffer(1,Math.ceil(a.sampleRate*dur),a.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.8);}
        const src=a.createBufferSource();src.buffer=buf;
        const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2300+k*1100;bp.Q.value=0.7;
        const g=a.createGain();
        g.gain.setValueAtTime(v*0.38,t+dt);g.gain.exponentialRampToValueAtTime(0.0001,t+dt+dur);
        src.connect(bp);bp.connect(g);g.connect(master);
        src.start(t+dt);
      });
      for(let k=0;k<3;k++){tone(1900+Math.random()*1300,0.05,'triangle',v*0.07,0.02+k*0.05);}
    },
    /* 揲四计数：短促清脆的节拍（木鱼/数珠感） */
    tick(){const v=vol();tone(1250,0.07,'square',v*0.045);tone(2500,0.05,'sine',v*0.05);},
    /* 卦成：寺庙梵钟，低沉基频+不谐和泛音+长余韵 */
    gong(){
      const v=vol();
      tone(65,4.2,'sine',v*0.55,0.02);      /* 极低频体感 */
      tone(98,3.6,'sine',v*0.85);           /* 基频 */
      tone(98*2.01,3.0,'sine',v*0.42);      /* 微偏八度（钟的 shimmer） */
      tone(98*2.98,2.4,'sine',v*0.28);      /* 不谐和泛音 */
      tone(196,2.9,'triangle',v*0.22,0.05);
      tone(98*4.16,1.8,'sine',v*0.16);      /* 高频泛音 */
      tone(392,1.4,'sine',v*0.12,0.08);
    },
    toggle(){muted=!muted;return muted;}
  };
})();
document.getElementById('btnMute').addEventListener('click',function(){this.classList.toggle('muted',sfx.toggle());});

/* ========== 生辰八字模块 ========== */
const BAZI=(function(){
  const STEMS=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const BRANCHES=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const ZODIAC=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
  const EL_STEM={'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
  const EL_BRANCH={'子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水'};
  /* 时辰→地支索引：0=子 1=丑 2=寅 ... 11=亥 12=不知 */
  const SHICHEN_MAP=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  /* 时辰对应公历小时范围 */
  const SHICHEN_HOURS=[[23,1],[1,3],[3,5],[5,7],[7,9],[9,11],[11,13],[13,15],[15,17],[17,19],[19,21],[21,23]];

  /* 立春近似日期（公历），用于年柱判断：通常在2月3-5日 */
  function lichunDate(year){ return new Date(year,1,4); /* 近似2月4日 */ }

  /* 计算日柱：基于儒略日数 */
  function daySexagenary(y,m,d){
    /* 儒略日数公式（公历） */
    const a=Math.floor((14-m)/12);
    const yy=y+4800-a;
    const mm=m+12*a-3;
    const JDN=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
    /* 甲子日参考：JDN 2451911 = 2001-01-01 = 辛巳年庚子月戊午日 */
    /* 戊午 = stem[4]+branch[6], sexagenary index = (4*6+6*5)%60... 直接算 */
    const stemIdx=((JDN+4)%10+10)%10; /* 偏移+4：使甲子日JDN对应甲(0) */
    const branchIdx=((JDN+6)%12+12)%12; /* 偏移+6：使甲子日JDN对应子(0) */
    return{stem:stemIdx,branch:branchIdx};
  }

  /* 计算年柱（基于立春分界） */
  function yearPillar(solarYear,solarMonth,solarDay){
    const solarDate=new Date(solarYear,solarMonth-1,solarDay);
    const lc=lichunDate(solarYear);
    const effectiveYear=solarDate>=lc?solarYear:solarYear-1;
    const stemIdx=((effectiveYear-4)%10+10)%10;
    const branchIdx=((effectiveYear-4)%12+12)%12;
    return{stem:stemIdx,branch:branchIdx};
  }

  /* 计算月柱（基于节气近似） */
  function monthPillar(yearStem,solarYear,solarMonth,solarDay){
    /* 节气近似确定农历月：以节为月份分界线 */
    /* 小寒≈1月6日→丑月,立春≈2月4日→寅月,惊蛰≈3月6日→卯月 */
    /* 清明≈4月5日→辰月,立夏≈5月6日→巳月,芒种≈6月6日→午月 */
    /* 小暑≈7月7日→未月,立秋≈8月7日→申月,白露≈9月8日→酉月 */
    /* 寒露≈10月8日→戌月,立冬≈11月7日→亥月,大雪≈12月7日→子月 */
    const terms=[
      {m:1,d:6,b:1},{m:2,d:4,b:2},{m:3,d:6,b:3},{m:4,d:5,b:4},
      {m:5,d:6,b:5},{m:6,d:6,b:6},{m:7,d:7,b:7},{m:8,d:7,b:8},
      {m:9,d:8,b:9},{m:10,d:8,b:10},{m:11,d:7,b:11},{m:12,d:7,b:0}
    ]; /* b=地支索引：丑=1,寅=2,...,亥=11,子=0 */
    const sd=new Date(solarYear,solarMonth-1,solarDay);
    let branchIdx=0; /* 默认子月（1月1日-1月5日） */
    for(let i=terms.length-1;i>=0;i--){
      if(sd>=new Date(solarYear,terms[i].m-1,terms[i].d)){
        branchIdx=terms[i].b;
        break;
      }
    }
    /* 月干：年上起月法 */
    /* 甲己之年丙作首，乙庚之岁戊为头，丙辛必定寻庚起，丁壬壬位顺行流，戊癸何方发壬求 */
    const monthStemBase=[2,4,6,8,0]; /* 甲己→丙(2),乙庚→戊(4),丙辛→庚(6),丁壬→壬(8),戊癸→癸(0) */
    const base=monthStemBase[yearStem%5];
    /* branchIdx=2(寅月)为第1个月，offset=0；3(卯)=1；...11(亥)=9；0(子)=10；1(丑)=11 */
    const monthOffset=branchIdx===0?10:branchIdx===1?11:branchIdx-2;
    const stemIdx=(base+monthOffset)%10;
    return{stem:stemIdx,branch:branchIdx};
  }

  /* 计算时柱 */
  function hourPillar(dayStem,hourBranchIdx){
    if(hourBranchIdx===12) return null; /* 不清楚时辰 */
    /* 日上起时法：甲己还加甲，乙庚丙作初，丙辛从戊起，丁壬庚子居，戊癸壬子头 */
    const hourStemBase=[0,2,4,6,8]; /* 甲己→甲(0),乙庚→丙(2),丙辛→戊(4),丁壬→庚(6),戊癸→壬(8) */
    const base=hourStemBase[dayStem%5];
    const stemIdx=(base+hourBranchIdx)%10;
    return{stem:stemIdx,branch:hourBranchIdx};
  }

  /* 五行统计 */
  function countElements(pillars){
    const count={'金':0,'木':0,'水':0,'火':0,'土':0};
    pillars.forEach(p=>{
      if(p){
        count[EL_STEM[STEMS[p.stem]]]++;
        count[EL_BRANCH[BRANCHES[p.branch]]]++;
      }
    });
    return count;
  }

  /* 日主强弱（简化版） */
  function dayMasterStrength(pillars,monthBranch){
    if(!pillars[2]) return{strength:'未知',desc:'时辰未知，无法精确判断'};
    const dayEl=EL_STEM[STEMS[pillars[2].stem]];
    const monthEl=EL_BRANCH[BRANCHES[monthBranch]];
    /* 月令生扶日主则得令 */
    const shengMap={'木':'水','火':'木','土':'火','金':'土','水':'金'}; /* X生Y */
    const sameEl=(dayEl===monthEl);
    const sheng=(shengMap[dayEl]===monthEl); /* 月令生日主 */
    /* 统计四柱中生扶日主的个数 */
    let support=0;
    pillars.forEach(p=>{
      if(!p) return;
      const se=EL_STEM[STEMS[p.stem]];
      const be=EL_BRANCH[BRANCHES[p.branch]];
      if(se===dayEl||shengMap[dayEl]===se) support++;
      if(be===dayEl||shengMap[dayEl]===be) support++;
    });
    const isStrong=(sheng||sameEl)&&support>=3;
    return{
      strength:isStrong?'身强':'身弱',
      desc:`日主${STEMS[pillars[2].stem]}${dayEl}，${sheng?'月令生扶':sameEl?'月令同气':'月令克泄'}，生扶数${support}/8`
    };
  }

  /* 喜用神推算（简化版） */
  function favorableElements(strength,dayEl){
    const shengMap={'木':'水','火':'木','土':'火','金':'土','水':'金'};
    const keMap={'木':'土','火':'金','土':'水','金':'木','水':'火'};
    if(strength==='身强'){
      /* 身强喜克泄耗：克我(官杀)、我生(食伤)、我克(财星) */
      return{favorable:[keMap[dayEl]],unfavorable:[dayEl,shengMap[dayEl]]};
    }else{
      /* 身弱喜生扶：生我(印星)、同我(比劫) */
      return{favorable:[shengMap[dayEl],dayEl],unfavorable:[keMap[dayEl]]};
    }
  }

  /* 大运计算（需性别） */
  function computeDaYun(yearStem,monthPillar,dayPillar,solarYear,solarMonth,solarDay,gender){
    if(!gender) return null;
    const isYangYear=yearStem%2===0; /* 甲丙戊庚壬=阳 */
    const isMale=gender==='M';
    const forward=(isYangYear&&isMale)||(!isYangYear&&!isMale); /* 阳年男/阴年女顺行 */
    /* 起运年龄≈出生日到最近节气的天数/3 */
    const terms=[{m:1,d:6},{m:2,d:4},{m:3,d:6},{m:4,d:5},{m:5,d:6},{m:6,d:6},{m:7,d:7},{m:8,d:7},{m:9,d:8},{m:10,d:8},{m:11,d:7},{m:12,d:7}];
    const bd=new Date(solarYear,solarMonth-1,solarDay);
    let minDiff=365;
    terms.forEach(t=>{
      const td=new Date(solarYear,t.m-1,t.d);
      const diff=Math.abs((bd-td)/(86400000));
      if(diff<minDiff) minDiff=diff;
    });
    const startAge=Math.max(1,Math.round(minDiff/3));
    /* 当前年龄（虚岁） */
    const now=new Date();
    const age=now.getFullYear()-solarYear+1;
    /* 当前大运索引 */
    if(age<startAge) return{startAge,current:null,periods:[],forward,preAge:true};
    const yearsIn=age-startAge;
    const periodIdx=Math.floor(yearsIn/10);
    /* 生成大运序列（8步） */
    const periods=[];
    for(let i=0;i<8;i++){
      const offset=forward?i+1:-(i+1);
      const stem=((monthPillar.stem+offset)%10+10)%10;
      const branch=((monthPillar.branch+offset)%12+12)%12;
      const startY=startAge+i*10;
      periods.push({stem,branch,startAge:startY,endAge:startY+9,
        label:STEMS[stem]+BRANCHES[branch],
        element:EL_STEM[STEMS[stem]]});
    }
    const current=periods[Math.min(periodIdx,periods.length-1)];
    return{startAge,current,periods,forward,preAge:false};
  }

  /* 主计算函数 */
  function calculate(solarYear,solarMonth,solarDay,hourBranchIdx,gender){
    const yp=yearPillar(solarYear,solarMonth,solarDay);
    const mp=monthPillar(yp.stem,solarYear,solarMonth,solarDay);
    const dp=daySexagenary(solarYear,solarMonth,solarDay);
    const hp=hourBranchIdx<12?hourPillar(dp.stem,hourBranchIdx):null;
    const pillars=[yp,mp,dp,hp];
    const elements=countElements(pillars);
    const dayEl=EL_STEM[STEMS[dp.stem]];
    const ds=dayMasterStrength(pillars,mp.branch);
    const fav=favorableElements(ds.strength,dayEl);
    const zodiacIdx=((solarYear-4)%12+12)%12;
    /* 立春前算上一年生肖 */
    const sd=new Date(solarYear,solarMonth-1,solarDay);
    const lc=lichunDate(solarYear);
    const effZodiac=sd<lc?((solarYear-5)%12+12)%12:zodiacIdx;
    const daYun=computeDaYun(yp.stem,mp,dp,solarYear,solarMonth,solarDay,gender);
    return{
      yearPillar:yp,monthPillar:mp,dayPillar:dp,hourPillar:hp,
      pillars:[yp,mp,dp,hp],
      elements,dayElement:dayEl,
      dayStrength:ds,favorable:fav,
      zodiac:ZODIAC[effZodiac],
      hasHour:hp!==null,
      gender:gender||null,
      daYun
    };
  }

  return{calculate,STEMS,BRANCHES,ZODIAC,EL_STEM,EL_BRANCH,SHICHEN_MAP};
})();

/* 应期推导 */
function computeTiming(benId,bianId,changingIdx,benBits,bianBits){
  const nChange=changingIdx.length;
  // 取主卦（有变则用变卦，无变则用本卦）的上下卦
  const srcBits=bianBits||benBits;
  const lower=srcBits[0]+srcBits[1]*2+srcBits[2]*4;
  const upper=srcBits[3]+srcBits[4]*2+srcBits[5]*4;
  const pri=TRIGRAM_TIMING[upper];  // 上卦为外/果
  const sec=TRIGRAM_TIMING[lower];  // 下卦为内/因
  // 年份计算：根据当前日期推导基础年份
  const now=new Date();
  const curYear=now.getFullYear();
  const curMonth=now.getMonth()+1;
  function baseYear(startMonth){
    return startMonth>curMonth?curYear:curYear+1;
  }
  // 起因（下卦/内）先算
  const secYear=baseYear(sec.startMonth);
  // 果成（上卦/外）必须在起因之后
  let priYear=baseYear(pri.startMonth);
  if(priYear<secYear){
    priYear=secYear; // 至少同年
  }
  if(priYear===secYear && pri.startMonth<sec.startMonth){
    priYear=secYear+1; // 同年但月份更早，推到下一年
  }
  // 跨年卦（坎卦 12-1月）
  const priYearEnd=pri.crossYear?priYear+1:priYear;
  const secYearEnd=sec.crossYear?secYear+1:secYear;
  // 动爻位置推导缓急：初爻=近，上爻=远
  let urgency='中';
  let urgencyNote='应期在月余之间';
  if(nChange>0){
    const minIdx=Math.min(...changingIdx);
    const maxIdx=Math.max(...changingIdx);
    if(maxIdx<=1){urgency='近';urgencyNote='动在下爻，应期在近前，快则三五日，慢则不过月余';}
    else if(minIdx>=3){urgency='远';urgencyNote='动在上爻，应期较远，需数月至半年方见分晓';}
    else{urgency='中';urgencyNote='动在中爻，应期在月余至一季之间';}
  }
  return{pri,sec,priYear,secYear,priYearEnd,secYearEnd,priSym:TRI_SYM[upper],secSym:TRI_SYM[lower],urgency,urgencyNote,nChange};
}

/* ========== 一变过程模拟 ========== */
function oneChange(total) {
  // 分二：随机分成两堆
  const left = Math.floor(Math.random() * (total - 2)) + 1;
  const right = total - left;
  // 挂一：从右堆取1根
  const r = right - 1;
  // 揲四：以四计数余数（1-4）
  const lRem = ((left - 1) % 4) + 1;
  const rRem = ((r - 1) % 4) + 1;
  // 归奇：挂1 + 左余 + 右余
  const used = 1 + lRem + rRem;
  return { left, right, lRem, rRem, used, remain: total - used };
}

/* ========== 一爻（三变） ========== */
function oneYao() {
  let total = 49;
  const changes = [];
  for (let i = 0; i < 3; i++) {
    const c = oneChange(total);
    changes.push(c.used);
    total = c.remain;
  }
  // 剩余数 / 4 → 6/7/8/9
  const num = total / 4;
  return { num, changes, remain: total };
}

/* ========== 蓍草演算舞台布局 ========== */
function stickTo(el,x,y,r){el.style.transform=`translate(${x}px,${-y}px) rotate(${r||0}deg)`;}
/* 将一组蓍草铺成一排，中心 cx，间距 sp，底部抬升 y */
function pileLayout(idxs,cx,sp,y,sticks){
  const n=idxs.length;if(!n)return;
  idxs.forEach((gi,i)=>{stickTo(sticks[gi],cx+(i-(n-1)/2)*sp,y,0);});
}
/* 揲四：按4根一组依次点亮，余数高亮 */
async function countByFour(idxs,remCount,sticks){
  const body=idxs.slice(0,idxs.length-remCount);
  const rem=idxs.slice(idxs.length-remCount);
  for(let g=0;g<body.length;g+=4){
    if(stopFlag)break;
    const grp=body.slice(g,g+4);
    grp.forEach(gi=>sticks[gi].classList.add('count-glow'));
    sfx.tick();
    await sleep(95);
    grp.forEach(gi=>sticks[gi].classList.remove('count-glow'));
  }
  if(!stopFlag)rem.forEach(gi=>sticks[gi].classList.add('remainder'));
}

      const rightRemIdxs=rightAfter.slice(rightAfter.length-oc.rRem);
      // ===== 分二：左右分堆 =====
      setStage('分而为二','以象两');
      const sp=Math.min(5,(W*0.42)/((Math.max(leftIdxs.length,rightIdxs.length)-1)||1));
      pileLayout(leftIdxs,W*0.26,sp,0,sticks);
      pileLayout(rightIdxs,W*0.74,sp,0,sticks);
      sfx.swish();
      const[lx,ly]=fxCenter(sticks[leftIdxs[leftIdxs.length-1]]);
      fxC.burst(lx,ly,'#ffd070',10,2.5);
      narrate(`分而为二 · 左 <b>${oc.left}</b> 策 · 右 <b>${oc.right}</b> 策`);
      await sleep(800);chk(); /* 分二后停顿 */
      // ===== 挂一：右堆取一策挂于指间 =====
      setStage('挂一以象三','');
      sticks[hungIdx].classList.add('hung');
      stickTo(sticks[hungIdx],W*0.5,hungY,0);
      narrate('挂一以象三 · 挂 <b>1</b> 策于指间');
      await sleep(600);chk(); /* 挂一后停顿 */
      // ===== 揲四：左堆四四而数，余数高亮 =====
      setStage('揲之以四','以象四时');
      await countByFour(leftIdxs,oc.lRem,sticks);
      narrate(`揲之以四 · 左堆余 <b>${oc.lRem}</b> 策`);
      await sleep(400);chk(); /* 揲四左后停顿 */
      // ===== 揲四：右堆 =====
      await countByFour(rightAfter,oc.rRem,sticks);
      narrate(`揲之以四 · 右堆余 <b>${oc.rRem}</b> 策`);
      await sleep(420);chk(); /* 揲四右后停顿 */
      // ===== 归奇：挂一+左右余数归扐，其余合拢 =====
      setStage('归奇于扐','以象闰');
      const setAside=[hungIdx,...leftRemIdxs,...rightRemIdxs];
      const keep=[...leftIdxs.slice(0,leftIdxs.length-oc.lRem),...rightAfter.slice(0,rightAfter.length-oc.rRem)];
      total=oc.remain;
      setAside.forEach((gi,k)=>{stickTo(sticks[gi],W*0.5+(k-(setAside.length-1)/2)*6,hungY,0);});
      pileLayout(keep,centerX,bundleSp,0,sticks);
      const[ax,ay]=fxCenter(vizEl);
      fxC.burst(ax,ay-70,'#e8c987',10,2.2);
      narrate(`归奇于扐 · 去 <b>${oc.used}</b> 策 · 余 <b>${total}</b> 策`);
      await sleep(900);chk(); /* 归奇后沉淀 */
      setAside.forEach(gi=>{sticks[gi].classList.remove('hung','remainder');sticks[gi].classList.add('removed');});
      activeList=keep;
    }
    const num=total/4;
    yaos.push(num);
    const isYangYao=(num===7||num===9),isDongYao=(num===6||num===9);
    const label=`${{6:'老阴',7:'少阳',8:'少阴',9:'老阳'}[num]} <i class="log-yao ${isYangYao?'yang':'yin'}"></i>${isDongYao?' 动':''}`;
    narrate(`第${i+1}爻（${names[i]}）得 <span class="biao">${num} · ${label}</span>`);
    // 逐爻构建卦象
    const yaoDiv=document.createElement('div');
    const isYang=(num===7||num===9);
    const isChanging=(num===6||num===9);
    yaoDiv.className='build-yao '+(isYang?'yang':'yin')+(isChanging?' changing':'');
    yaoDiv.style.animationDelay='0s';
    if(isYang){yaoDiv.innerHTML='<div class="bar"></div>';}
    else{yaoDiv.innerHTML='<div class="bar"></div><div class="bar"></div>';}
    if(isChanging)yaoDiv.innerHTML+='<span class="dong-badge">动<i class="mini-star"></i></span>';
    buildEl.appendChild(yaoDiv);
    // 落定瞬间：火花 + 圆环 + 钟声 + 进度里程碑脉冲
    const[yx,yy]=fxCenter(yaoDiv);
    sfx.yao(i);
    progFill.classList.remove('milestone');void progFill.offsetWidth;progFill.classList.add('milestone');
    fxC.burst(yx,yy,'#e8c987',12,3);
    fxC.ring(yx,yy,'#c89a5a',8,60);
    auraEl.style.opacity=((i+1)/6*0.8).toFixed(2);
    if(isChanging){
      // 动爻爆发：金/银大火花 + 冲击波 + 全屏脉动 + 亮音
      const cBig=(num===9)?'#ffd070':'#cfe0ee';
      await sleep(200);
      fxC.burst(yx,yy,cBig,26,5);
      fxC.ring(yx,yy,cBig,12,110);
      sfx.change();
      flashEl.classList.remove('pulse');void flashEl.offsetWidth;flashEl.classList.add('pulse');
    }
    await sleep(400);
  }
  }catch(e){if(e==='ABORT'){bail();return;}throw e;}
  await sleep(500);
  // 揭晓特效：光芒 + 冲击波 + 锣声
  const overlay=document.getElementById('revealOverlay');
  overlay.classList.add('active');
  sfx.gong();
  const cx=window.innerWidth/2,cy=window.innerHeight/2;
  fxC.ring(cx,cy,'#ffd070',20,Math.min(window.innerWidth,520));
  fxC.burst(cx,cy,'#ffd070',30,6);
  fxC.burst(cx,cy,'#e8c987',20,4);
  fxC.burst(40,40,'#c89a5a',8,3);fxC.burst(window.innerWidth-40,40,'#c89a5a',8,3);
  fxC.burst(40,window.innerHeight-40,'#c89a5a',8,3);fxC.burst(window.innerWidth-40,window.innerHeight-40,'#c89a5a',8,3);
  await sleep(1800);
  // 计算结果（门后准备）
  const benGua=yaos.map(n=>(n===7||n===9)?1:0);
  const bianGua=yaos.map(n=>n===9?0:(n===6?1:((n===7)?1:0)));
  const changingIdx=yaos.map((n,i)=>(n===6||n===9)?i:-1).filter(i=>i>=0);
  const benId=hexIdFromYaos(benGua);
  let bianId=null;
  if(changingIdx.length>0){bianId=hexIdFromYaos(bianGua);}
  // 关门（遮住起卦页），门后展开解卦页
  const doors=document.getElementById('doors');
  const pageResult=document.getElementById('pageResult');
  const backdrop=document.getElementById('resultBackdrop');
  document.getElementById('resultGuaName').textContent=GUA[benId][0];
  pageResult.classList.remove('revealed');
  pageResult.scrollTop=0;
  pageProc.classList.remove('active'); /* 隐藏演算页（在卦成遮罩后方） */
  doors.classList.add('closed');
  pageResult.classList.add('active');
  backdrop.classList.add('active');
  document.body.classList.add('locked');
  await sleep(700);
  // 淡出卦成遮罩 → 露出闭合双门（中缝金光）
  overlay.classList.remove('active');
  await sleep(500);
  // 开门见卦：锣声 + 中缝金色爆发
  sfx.gong();
  doors.classList.remove('closed');
  const sx=window.innerWidth/2;
  for(let yy=window.innerHeight*0.18;yy<window.innerHeight*0.9;yy+=window.innerHeight*0.15){fxC.burst(sx,yy,'#ffd070',9,3.2);}
  fxC.ring(sx,window.innerHeight/2,'#ffd070',16,200);
  // 门开同时渲染解析（让入场动画可见）+ 门楣浮现
  renderHex(yaos,changingIdx,benId,bianId);
  /* 读取生辰八字（若有） */
  let baziData=null;
  const byy=parseInt(document.getElementById('baziYear').value);
  const bmm=parseInt(document.getElementById('baziMonth').value);
  const bdd=parseInt(document.getElementById('baziDay').value);
  const bhh=document.getElementById('baziHour').value;
  if(byy&&bmm&&bdd){
    const hourIdx=bhh===''||bhh===undefined?12:parseInt(bhh);
    const gender=document.getElementById('baziGender').value||null;
    baziData=BAZI.calculate(byy,bmm,bdd,hourIdx,gender);
  }
  renderInterpret(yaos,changingIdx,benId,bianId,q,baziData);
  setupScrollReveal();
  pageResult.classList.add('revealed');
  await sleep(900);
  // 显示“再占”按钮
  document.getElementById('btnAgain').classList.add('show');
  // 重置起卦页状态（解卦页后方）
  pageProc.classList.remove('active');
  document.getElementById('particles').classList.remove('dense');
  auraEl.style.opacity=0;
  btn.disabled=false;
  btn.classList.remove('divining');
  btn.innerHTML='起卦<span class="ripple"></span>';
}

function hexIdFromYaos(bits) {
  const lower = bits[0] + bits[1] * 2 + bits[2] * 4;
  const upper = bits[3] + bits[4] * 2 + bits[5] * 4;
  return HEX_MAP[lower * 8 + upper];
}

function renderHex(yaos, changingIdx, benId, bianId) {
  const hexEl = document.getElementById('hexDisplay');
  hexEl.innerHTML = '';
  hexEl.appendChild(makeHexBox('本 卦', yaos.map(n => (n === 7 || n === 9) ? 1 : 0), changingIdx, benId));
  if (bianId) {
    hexEl.appendChild(makeHexBox('变 卦', yaos.map(n => n === 9 ? 0 : n === 6 ? 1 : ((n === 7) ? 1 : 0)), [], bianId));
  }
}

function makeHexBox(title, bits, changingIdx, gid) {
  const g = GUA[gid];
  const lower = bits[0] + bits[1] * 2 + bits[2] * 4;
  const upper = bits[3] + bits[4] * 2 + bits[5] * 4;
  const box = document.createElement('div');
  box.className = 'hex-box';
  const yaosHtml = bits.map((b, i) => {
    const cls = (b === 1 ? 'yao yang' : 'yao yin') + (changingIdx.includes(i) ? ' changing' : '');
    return b === 1
      ? `<div class="${cls}"><div class="bar"></div></div>`
      : `<div class="${cls}"><div class="bar"></div><div class="bar"></div></div>`;
  }).join('');
  const nameStr = `${title}：${g[0]}`;
  const nameHtml = nameStr.split('').map((ch,i)=>`<span class="ch" style="animation-delay:${0.3+i*0.12}s">${ch}</span>`).join('');
  box.innerHTML = `
    <div class="hex-name">${nameHtml}</div>
    <div class="hex-sub">${TRI_SYM[upper]} ${TRIGRAM[upper]}上 · ${TRIGRAM[lower]}下 ${TRI_SYM[lower]}（第 ${gid} 卦）</div>
    <div class="hex-visual">${yaosHtml}</div>
  `;
  return box;
}

function renderInterpret(yaos, changingIdx, benId, bianId, question, baziData) {
  const el = document.getElementById('interpret');
  const g = GUA[benId];
  const yaoNames = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];
  const nChange = changingIdx.length;
  let html = '';

  // ===== 1. 天机总览（结论前置）=====
  const s = summarize(g[1], nChange > 0 && nChange < 6 ? changingIdx.map(i => g[i + 2]).join('；') : g[1], bianId ? GUA[bianId][1] : '');
  const tip = GUA_TIP[benId] || '';
  const firstSentence = tip.split(/[。！？]/)[0];
  html += `<div class="tianji">`;
  if (question) html += `<div class="tianji-question">你为 <b>「${escapeHtml(question)}」</b> 而问</div>`;
  html += `<div class="tianji-verdict" style="color:${s.color}">${s.label}</div>`;
  if (firstSentence) html += `<div class="tianji-line"><span class="qmark">「</span>${firstSentence}<span class="qmark">」</span></div>`;
  html += `</div>`;

  // ===== 2. 现状 · 本卦 =====
  html += `<div class="section-title">◆ 现 状 · 你正处在「${g[0]}」的格局</div>`;
  html += `<div class="narrative sr">
    <div class="narr-main">${tip}</div>
    <div class="quote">${g[1]}</div>
  </div>`;

  // ===== 3. 转折 · 动爻 =====
  if (nChange > 0 && nChange < 6) {
    html += `<div class="section-title">◆ 转 折 · 变化正在发生</div>`;
    changingIdx.forEach(i => {
      const p = yaoPlain(g[i + 2], i);
      const yaoNum = yaos[i];
      const isYangDong = yaoNum === 9;
      const yaoLabel = isYangDong ? '老阳动' : '老阴动';
      const dongMeaning = isYangDong
        ? '老阳动，是阳刚之势由盛转柔、主动求变之象，宜顺势而为、勿恋栈旧局'
        : '老阴动，是柔顺之势由静转动、否极泰来之象，宜把握转机、积极应对';
      const hintSentence = p.hints.length
        ? `爻辞的意思是：${p.hints.join('；')}。`
        : '此爻辞需结合你所问之事细细体会。';
      html += `<div class="narrative sr">
        <div class="narr-lead"><i class="narr-star"></i>变化出现在第${['一','二','三','四','五','六'][i]}步（${yaoNames[i]} · ${yaoLabel}）</div>
        <div class="narr-main">这一步正处在「${p.position}」。${hintSentence}${dongMeaning}。</div>
        <div class="quote">${g[i + 2]}</div>
      </div>`;
    });
  }

  // ===== 4. 趋向 · 变卦 =====
  if (bianId && nChange > 0) {
    html += `<div class="section-title">◆ 趋 向 · 事态将转向「${GUA[bianId][0]}」</div>`;
    html += `<div class="narrative sr">
      <div class="narr-main">${GUA_TIP[bianId] || ''}</div>
      <div class="quote">${GUA[bianId][1]}</div>
    </div>`;
  }

  // ===== 4.5 应期 · 何时应验 =====
  const benBits = yaos.map(n => (n===7||n===9) ? 1 : 0);
  const bianBits = bianId ? yaos.map(n => n===9 ? 0 : (n===6 ? 1 : ((n===7) ? 1 : 0))) : null;
  const timing = computeTiming(benId, bianId, changingIdx, benBits, bianBits);
  const srcName = bianId ? `「${GUA[bianId][0]}」` : `「${GUA[benId][0]}」`;
  const urgColor = timing.urgency==='近'?'#ff9a3d':timing.urgency==='远'?'#8ab4f8':'#c89a5a';
  html += `<div class="section-title">◆ 应 期 · 何时应验</div>`;
  html += `<div class="narrative timing sr">
    <div class="timing-lead">此卦变入${srcName}，下卦为「${timing.sec.name}${timing.secSym}」，上卦为「${timing.pri.name}${timing.priSym}」。</div>
    <div class="timing-block">
      <div class="timing-row"><span class="timing-label">起因之月</span><span class="timing-val">${timing.sec.season} · ${timing.sec.lunar}（约${timing.sec.crossYear?`${timing.secYear}年${timing.sec.solar}至${timing.secYearEnd}年${timing.sec.solarEnd}`:`${timing.secYear}年${timing.sec.solar}`}）</span></div>
      <div class="timing-row"><span class="timing-label">果成之时</span><span class="timing-val">${timing.pri.season} · ${timing.pri.lunar}（约${timing.pri.crossYear?`${timing.priYear}年${timing.pri.solar}至${timing.priYearEnd}年${timing.pri.solarEnd}`:`${timing.priYear}年${timing.pri.solar}`}）</span></div>
      <div class="timing-row"><span class="timing-label">得力方位</span><span class="timing-val">${timing.pri.direction}（${timing.pri.element}象）</span></div>
      <div class="timing-row"><span class="timing-label">吉时</span><span class="timing-val">${timing.pri.hour}</span></div>
    </div>
    <div class="timing-note">${timing.urgencyNote}。应期<b style="color:${urgColor}">${timing.urgency}</b>，宜在${timing.pri.direction}方位、${timing.pri.element}旺之时行事。</div>
  </div>`;

  // ===== 5. 锦囊 · 给你的建议 =====
  html += `<div class="section-title">◆ 锦 囊 · 给你的建议</div>`;
  html += `<div class="narrative advice sr"><div class="narr-main">${s.advice}</div></div>`;

  // ===== 6. 四维详解（合并后的一套分类卡片）=====
  const benAsp = GUA_ASPECTS[benId];
  const bianAsp = (bianId && nChange > 0) ? GUA_ASPECTS[bianId] : null;
  if (benAsp) {
    const aspectLabels = [
      { key: 'career', icon: '💼', title: '事业' },
      { key: 'love',   icon: '❤️', title: '爱情' },
      { key: 'health', icon: '🏥', title: '健康' },
      { key: 'wealth', icon: '💰', title: '财运' }
    ];
    html += `<div class="section-title">◆ 四 维 详 解</div>`;
    if (bianAsp) {
      html += `<div class="aspects-intro sr">当前处于<b style="color:#e8c987">「${GUA[benId][0]}」</b>，事态将向<b style="color:#e8c987">「${GUA[bianId][0]}」</b>方向发展，各方面具体如下：</div>`;
      html += `<div class="aspects-grid sr">`;
      aspectLabels.forEach(a => {
        html += `<div class="aspect-card">
          <div class="aspect-icon">${a.icon}</div>
          <div class="aspect-title">${a.title}</div>
          <div class="aspect-text">
            <div style="margin-bottom:6px;"><b style="color:#c89a5a;">现状：</b>${benAsp[a.key]}</div>
            <div style="margin-bottom:6px;"><b style="color:#8ab4f8;">趋向：</b>${bianAsp[a.key]}</div>
            <div style="color:#d4a870;font-size:12px;border-top:1px dashed rgba(107,74,43,.3);padding-top:6px;margin-top:4px;"><b>⚡ 注意：</b>${getTransitionNote(a.key, benId, bianId)}</div>
          </div>
        </div>`;
      });
      html += `</div>`;
    } else {
      const aspSource = (nChange === 6 && bianAsp) ? bianAsp : benAsp;
      const aspTitle = (nChange === 6 && bianAsp) ? `六爻皆变，以变卦「${GUA[bianId][0]}」为主` : `静卦，以本卦「${GUA[benId][0]}」为主`;
      html += `<div class="aspects-intro sr">${aspTitle}，各方面解读如下：</div>`;
      html += `<div class="aspects-grid sr">`;
      aspectLabels.forEach(a => {
        html += `<div class="aspect-card">
          <div class="aspect-icon">${a.icon}</div>
          <div class="aspect-title">${a.title}</div>
          <div class="aspect-text">${aspSource[a.key]}</div>
        </div>`;
      });
      html += `</div>`;
    }
  }

  // ===== 6.5 命卦合参（若有生辰） =====
  if(baziData){
    const S=BAZI.STEMS, B=BAZI.BRANCHES;
    const pStr=baziData.pillars.map((p,i)=>{
      if(!p) return ['',''][0];
      return S[p.stem]+B[p.branch];
    });
    const elCount=baziData.elements;
    const elArr=Object.entries(elCount).map(([k,v])=>`${k}${v}`).join(' ');
    const favStr=baziData.favorable.favorable.join('、');
    const unfavStr=baziData.favorable.unfavorable.join('、');
    const dayMaster=S[baziData.dayPillar.stem]+baziData.dayElement;
    /* 卦象五行：取上下卦的五行 */
    const upperTri=Math.floor(benId/8); /* 上卦索引 */
    const lowerTri=benId%8; /* 下卦索引 */
    const guaElUpper=TRIGRAM_TIMING[upperTri]?.element||'';
    const guaElLower=TRIGRAM_TIMING[lowerTri]?.element||'';
    /* 卦象五行与八字喜忌的关系 */
    let elRelation='';
    const guaEls=[guaElUpper,guaElLower].filter(Boolean);
    const favHits=guaEls.filter(e=>baziData.favorable.favorable.includes(e));
    const unfavHits=guaEls.filter(e=>baziData.favorable.unfavorable.includes(e));
    if(favHits.length>0) elRelation=`此卦上下卦五行属「${guaEls.join('、')}」，其中${favHits.join('、')}为你所喜，助力更强。`;
    else if(unfavHits.length>0) elRelation=`此卦上下卦五行属「${guaEls.join('、')}」，其中${unfavHits.join('、')}为你所忌，需多加留意。`;
    else if(guaEls.length>0) elRelation=`此卦上下卦五行属「${guaEls.join('、')}」，与你八字无特别喜忌。`;
    html += `<div class="section-title">◆ 命卦合参 · 生辰八字</div>`;
    html += `<div class="narrative bazi-section sr">
      <div class="bazi-pills">
        <span class="pill-label">年柱</span><span class="pill-val">${pStr[0]||'--'}</span>
        <span class="pill-label">月柱</span><span class="pill-val">${pStr[1]||'--'}</span>
        <span class="pill-label">日柱</span><span class="pill-val">${pStr[2]||'--'}</span>
        <span class="pill-label">时柱</span><span class="pill-val">${pStr[3]||'未知'}</span>
      </div>
      <div class="bazi-meta">
        <div>生肖：<b>${baziData.zodiac}</b> 日主：<b>${dayMaster}</b> ${baziData.dayStrength.strength!=='未知'?`强弱：<b>${baziData.dayStrength.strength}</b>`:''}</div>
        <div>五行：${elArr}</div>
        <div>喜用：<span class="fav">${favStr||'--'}</span> 忌：${unfavStr||'--'}</div>
        ${baziData.daYun&&baziData.daYun.current?`<div>大运：<b>${baziData.daYun.current.label}</b>（${baziData.daYun.current.startAge}-${baziData.daYun.current.endAge}岁）五行<em>${baziData.daYun.current.element}</em> ${baziData.daYun.forward?'顺行':'逆行'}</div>`:''}
        ${baziData.daYun&&baziData.daYun.preAge?`<div>尚未起运（${baziData.daYun.startAge}岁起运）</div>`:''}
        ${!baziData.daYun&&baziData.gender?'':''}
        ${!baziData.gender?'<div style="color:#5a4838">ℹ 填写性别可推算大运，应期更精准</div>':''}
        ${elRelation?`<div class="gua-el-note">${elRelation}</div>`:''}
      </div>
    </div>`;
  }

  // ===== 7. 占法脚注 =====
  html += `<div class="footnote sr">占法说明：${makeAdvice(nChange, benId, bianId, changingIdx).replace(/<[^>]+>/g, '')} 以上解读基于《周易》大衍筮法，仅供参悟。</div>`;

  el.innerHTML = html;
  // 逐段淡入动画

}

/* 根据关键字统计吉凶倾向 */
function summarize(benText, focusText, bianText) {
  const score = (t) => {
    let s = 0;
    if (!t) return 0;
    ['元吉', '大吉', '贞吉', '终吉'].forEach(k => t.includes(k) && (s += 3));
    (t.match(/吉/g) || []).forEach(() => s += 2);
    (t.match(/亨/g) || []).forEach(() => s += 1);
    (t.match(/无咎/g) || []).forEach(() => s += 1);
    (t.match(/悔亡/g) || []).forEach(() => s += 1);
    (t.match(/凶/g) || []).forEach(() => s -= 3);
    (t.match(/厉/g) || []).forEach(() => s -= 2);
    (t.match(/吝/g) || []).forEach(() => s -= 2);
    (t.match(/悔/g) || []).forEach(() => s -= 1);
    return s;
  };
  const total = score(benText) + score(focusText) * 2 + score(bianText);
  if (total >= 6) return {label:'大吉 ☀', color:'#ffd070', advice:'卦象顺遂，天时地利皆备。可积极行动、把握机遇，但盛极必衰，得意时勿忘谦退。'};
  if (total >= 2) return {label:'偏吉 ✿', color:'#c4d97a', advice:'总体有利，宜守正道、稳步前行。切忌贪功冒进，小步快跑方为上策。'};
  if (total >= -1) return {label:'平和 ○', color:'#a89880', advice:'吉凶未定，事在人为。宜审时度势、谨慎试探，静观其变再做决断。'};
  if (total >= -4) return {label:'偏凶 ⚠', color:'#e89060', advice:'阻力显现，宜退守蓄锐、以静制动。强求则损，忍耐方为上策。'};
  return {label:'凶险 ✕', color:'#ff6b3d', advice:'形势不利，宜暂停行动、反躬自省。此时妄动必失，守静待时方为上策。'};
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms / playbackSpeed)); }
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ========== 滚动浮现（IntersectionObserver）========== */
let srObserver=null;
function setupScrollReveal(){
  const pageResult=document.getElementById('pageResult');
  if(srObserver){srObserver.disconnect();}
  const items=pageResult.querySelectorAll('.sr');
  srObserver=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add('show');srObserver.unobserve(e.target);}
    });
  },{root:pageResult,threshold:0.1});
  items.forEach(el=>srObserver.observe(el));
}

/* ===== 生辰八字面板 ===== */
(function(){
  const toggle=document.getElementById('baziToggle');
  const panel=document.getElementById('baziPanel');
  const selY=document.getElementById('baziYear');
  const selM=document.getElementById('baziMonth');
  const selD=document.getElementById('baziDay');
  const selH=document.getElementById('baziHour');
  const selG=document.getElementById('baziGender');
  const clearBtn=document.getElementById('baziClear');
  /* 填充年份（1940-2010） */
  for(let y=2010;y>=1940;y--){const o=document.createElement('option');o.value=y;o.textContent=y+'年';selY.appendChild(o);}
  selY.insertAdjacentHTML('afterbegin','<option value="">--</option>');
  selY.value=''; /* 强制重置，防止浏览器自动填充 */
  /* 填充月份 */
  selM.innerHTML='<option value="">--</option>';
  for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'月';selM.appendChild(o);}
  /* 填充日期 */
  function fillDays(){
    const y=parseInt(selY.value);
    const m=parseInt(selM.value);
    selD.innerHTML='<option value="">--</option>';
    if(!y||!m) return; /* 年或月未选时不填日期 */
    const maxD=new Date(y,m,0).getDate();
    const curD=parseInt(selD.value);
    for(let d=1;d<=maxD;d++){const o=document.createElement('option');o.value=d;o.textContent=d+'日';selD.appendChild(o);}
    if(curD&&curD<=maxD) selD.value=curD;
  }
  /* 初始不填日期，等年月都选了才填 */
  selD.innerHTML='<option value="">--</option>'; /* 初始显示 -- */
  selY.addEventListener('change',fillDays);
  selM.addEventListener('change',fillDays);
  /* 填充时辰 */
  selH.innerHTML='<option value="">不知</option>';
  const shiChen=['子时（23-1点）','丑时（1-3点）','寅时（3-5点）','卯时（5-7点）','辰时（7-9点）','巳时（9-11点）','午时（11-13点）','未时（13-15点）','申时（15-17点）','酉时（17-19点）','戌时（19-21点）','亥时（21-23点）'];
  shiChen.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s;selH.appendChild(o);});
  /* 折叠切换 */
  toggle.addEventListener('click',()=>{
    toggle.classList.toggle('open');
    panel.classList.toggle('open');
  });
  /* localStorage 读写 */
  function saveBazi(){
    const data={y:selY.value,m:selM.value,d:selD.value,h:selH.value,g:selG.value};
    try{localStorage.setItem('shicao_bazi',JSON.stringify(data));}catch(e){}
  }
  function loadBazi(){
    try{
      const raw=localStorage.getItem('shicao_bazi');
      if(!raw) return;
      const data=JSON.parse(raw);
      if(data.y) selY.value=data.y;
      fillDays();
      if(data.m) selM.value=data.m;
      fillDays();
      if(data.d) selD.value=data.d;
      if(data.h!==undefined&&data.h!=='') selH.value=data.h;
      if(data.g) selG.value=data.g;
      if(data.y) { toggle.classList.add('open'); panel.classList.add('open'); }
    }catch(e){}
  }
  loadBazi();
  [selY,selM,selD,selH,selG].forEach(s=>s.addEventListener('change',saveBazi));
  /* 清空 */
  clearBtn.addEventListener('click',()=>{
    selY.value='';selM.value='';selD.value='';selH.value='';selG.value='';
    fillDays();
    try{localStorage.removeItem('shicao_bazi');}catch(e){}
  });
})();
</script>
</body>
